name: Android Build

# Builds the Capacitor Android app as a signed APK + AAB artifact.
# Separate from deploy.yml (web PWA) on purpose — see CLAUDE.md "Android platform".
# Not enabled on `main` pushes yet: this is a manual/iterative pipeline until
# the Android build has proven stable (see ROADMAP.md).

on:
  workflow_dispatch:
  push:
    branches: [claude/coverdex-android-capacitor-f9rr2j]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @capacitor/cli 8.x requires Node >=22 (`cap sync` fails on 20, which
      # is what deploy.yml/pr-check.yml still use for the web-only pipeline).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run web test suite
        run: npm run test

      - name: Build web app
        run: npm run build
        env:
          VITE_BASE_URL: /

      - name: Sync web build into Android project
        run: npx cap sync android

      # JDK 21 matches the AGP 8.13 / Gradle 8.14 toolchain generated by
      # @capacitor/android at implementation time. Re-check this pin if
      # Capacitor or AGP is upgraded (see docs/android/BUILD.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/android/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Gradle lint + unit tests
        working-directory: android
        run: ./gradlew lint testDebugUnitTest

      - name: Build signed release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Clean up keystore secrets
        if: always()
        working-directory: android
        run: rm -f release.keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: coverdex-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: coverdex-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # Emulator-based Espresso smoke test. Deliberately NOT part of the required
  # `build` job above (or its trigger) — GitHub-hosted emulator runners are
  # slow/costly relative to the value of one smoke test at this stage. Run it
  # manually via workflow_dispatch. See docs/android/BUILD.md and ROADMAP.md.
  instrumented-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_URL: /
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Espresso smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedAndroidTest
