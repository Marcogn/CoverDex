name: Android Build

# Builds the Capacitor Android app (signed release APK + AAB on every push
# to the Android dev branch or on demand; a debug APK only ever on-demand,
# see the debug-build job below). Separate from deploy.yml (web PWA) on
# purpose — see CLAUDE.md "Android platform". Not enabled on `main` pushes
# yet: this is a manual/iterative pipeline until the Android build has
# proven stable (see ROADMAP.md).
#
# This repo is public. actions/upload-artifact is NEVER used for any
# APK/AAB here — Actions artifacts are downloadable by any signed-in GitHub
# user with read access, debug builds included. Instead, both APKs go to
# Firebase App Distribution, which only reaches testers explicitly invited
# by email. See docs/android/BUILD.md.

on:
  workflow_dispatch:
  push:
    branches: [claude/coverdex-android-capacitor-0vx8vl]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @capacitor/cli 8.x requires Node >=22 (`cap sync` fails on 20, which
      # is what deploy.yml/pr-check.yml still use for the web-only pipeline).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `secrets` isn't a valid named-value inside `if:` expressions (GitHub
      # Actions only exposes it to `env:`/`with:`), so presence checks are
      # done here once, as step outputs, and every conditional step below
      # branches on `steps.secrets_check.outputs.*` instead of `secrets.*`
      # directly.
      - name: Check which optional secrets are configured
        id: secrets_check
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "has_keystore=true" >> "$GITHUB_OUTPUT"; else echo "has_keystore=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "has_firebase=true" >> "$GITHUB_OUTPUT"; else echo "has_firebase=false" >> "$GITHUB_OUTPUT"; fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run web test suite
        run: npm run test

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Android web bundle into Android project
        run: npx cap sync android

      # JDK 21 matches the AGP 8.13 / Gradle 8.14 toolchain generated by
      # @capacitor/android at implementation time. Re-check this pin if
      # Capacitor or AGP is upgraded (see docs/android/BUILD.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      # Signing is optional here on purpose: android/app/build.gradle only
      # applies a signingConfig when keystore.properties exists, so without
      # the ANDROID_KEYSTORE_BASE64 secret this still produces a build
      # instead of failing. Once the secrets below are set (see
      # docs/android/BUILD.md), release builds become signed automatically —
      # no workflow change needed. Values are never echoed to the log.
      - name: Decode release keystore
        if: steps.secrets_check.outputs.has_keystore == 'true'
        working-directory: android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write keystore.properties
        if: steps.secrets_check.outputs.has_keystore == 'true'
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/android/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Warn if building unsigned
        if: steps.secrets_check.outputs.has_keystore == 'false'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building an UNSIGNED release artifact. See docs/android/BUILD.md to add signing secrets."

      - name: Gradle lint + unit tests
        working-directory: android
        run: ./gradlew lint testDebugUnitTest

      - name: Build release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Clean up keystore secrets
        if: always()
        working-directory: android
        run: rm -f release.keystore keystore.properties

      # Optional at the workflow level, same graceful-degradation pattern as
      # keystore signing above: without FIREBASE_APP_ID/FIREBASE_SERVICE_ACCOUNT,
      # build/lint/test still pass, only distribution is skipped with a
      # warning. Release notes intentionally carry only the commit SHA,
      # never secret values.
      - name: Distribute release APK via Firebase App Distribution
        if: steps.secrets_check.outputs.has_firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-release
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "release build, commit ${{ github.sha }}"

      - name: Warn if Firebase distribution was skipped
        if: steps.secrets_check.outputs.has_firebase == 'false'
        run: echo "::warning::FIREBASE_APP_ID/FIREBASE_SERVICE_ACCOUNT not set — the release APK was not distributed anywhere. See docs/android/BUILD.md."

  # Debug APK, on demand only — deliberately NOT built on every push (unlike
  # assembleRelease above). Trigger it manually via
  # Actions -> Android Build -> Run workflow whenever you actually want a
  # debug build distributed; it never runs automatically. Since it's its
  # own job (and, on a manual dispatch, its own section of that run), you
  # can delete that workflow run from the Actions history afterward if you
  # don't want the record kept — nothing here persists a debug build
  # anywhere else. Debug builds use Android's default debug signing, so no
  # keystore secret is needed for this job.
  debug-build:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check which optional secrets are configured
        id: secrets_check
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "has_firebase=true" >> "$GITHUB_OUTPUT"; else echo "has_firebase=false" >> "$GITHUB_OUTPUT"; fi
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npm run build:android
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Distribute debug APK via Firebase App Distribution
        if: steps.secrets_check.outputs.has_firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-debug
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "debug build, commit ${{ github.sha }}"

      - name: Warn if Firebase distribution was skipped
        if: steps.secrets_check.outputs.has_firebase == 'false'
        run: echo "::warning::FIREBASE_APP_ID/FIREBASE_SERVICE_ACCOUNT not set — the debug APK was not distributed anywhere. See docs/android/BUILD.md."

  # Emulator-based Espresso smoke test. Deliberately NOT part of the required
  # `build` job above (or its trigger) — GitHub-hosted emulator runners are
  # slow/costly relative to the value of one smoke test at this stage. Run it
  # manually via workflow_dispatch. See docs/android/BUILD.md and ROADMAP.md.
  instrumented-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Espresso smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedAndroidTest
