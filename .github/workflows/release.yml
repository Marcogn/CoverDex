name: Release

# Cuts a public release, end to end: builds a signed Android release APK,
# publishes it as a GitHub Release with the CHANGELOG.md entry for that
# version as the release notes, AND deploys the same version of the web
# app to GitHub Pages — all in one run, so the Android release and the
# live site are always on the same version. Manual-dispatch only.
#
# The release notes come from that CHANGELOG.md section verbatim only
# when it's short. Past a size threshold (see "Extract changelog section"
# below) the full text is replaced with just its "### " subsection
# headings (or top-level "- **bold**" bullets, for a version with no
# subsections) plus a link back to CHANGELOG.md — a huge release body is
# unreadable on the GitHub Releases page, and the full write-up is
# already versioned in the repo.
#
# The release version is READ from package.json's "version" field, never
# written by this workflow — `main` requires pull requests (see repo
# Settings -> Branches), and a workflow that never needs to commit
# anything to `main` never has to deal with that at all, unlike a
# workflow that tries to bump-and-push its own version first (see the
# commit that replaced that approach, and docs/STATUS.md's loose ends,
# for what didn't work and why). Same pattern already proven out in
# github.com/Marcogn/ThePatientGamerHelper's release.yml: bump the
# version yourself in a normal PR (and add the matching CHANGELOG.md
# entry) before triggering this workflow — it refuses to overwrite a
# release/tag that already exists, so re-running it before bumping
# anything is a safe no-op failure, not a duplicate release.
#
# See ci.yml for the workflow that runs on every PR/push instead (tests
# only, no publishing).
#
# Like android-build.yml, this never uploads Android build output via
# actions/upload-artifact — the APK here is instead attached directly to
# a GitHub Release, which is meant to be public, so that's the intended
# distribution channel for this workflow specifically.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      # @capacitor/cli 8.x requires Node >=22, same as android-build.yml.
      # Building the plain web app (for Pages) on the same Node version is
      # fine — only the Capacitor CLI actually needs 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read release version and refuse to overwrite an existing one
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json's version ('$VERSION') is not a plain X.Y.Z semantic version."
            exit 1
          fi

          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Bump \"version\" in package.json (and add a matching CHANGELOG.md entry) via a normal PR, merge it, then re-run this workflow."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run web test suite
        run: npm run test

      - name: Generate PWA icons
        run: node scripts/generate-icons.mjs

      - name: Build web app (GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_URL: /CoverDex/

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Android web bundle into Android project
        run: npx cap sync android

      # Only the build in this checkout needs Android's versionName/
      # versionCode to match package.json's version — never committed
      # back, since package.json is the only file anyone needs to bump.
      - name: Sync Android version from package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle

      - name: Ensure signing secrets are present
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 (and the other ANDROID_KEY* secrets) must be set to cut a public release — an unsigned APK can't be installed on a device. See docs/android/BUILD.md."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # JDK 21 matches the AGP 8.13 / Gradle 8.14 toolchain, same pin as
      # android-build.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: android
        run: |
          if ! echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore || [ ! -s release.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't valid base64 (or decoded to an empty file). This is almost always copy-paste corruption of the secret's value — stray whitespace/newlines, a shell prompt artifact (e.g. zsh's trailing '%'), or the raw .keystore file pasted instead of its base64 encoding. Regenerate it without copy-paste: base64 -w0 android/coverdex-release.keystore | gh secret set ANDROID_KEYSTORE_BASE64 -R marcogn/CoverDex. See docs/android/BUILD.md."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/android/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Gradle lint + unit tests
        working-directory: android
        run: ./gradlew lint testDebugUnitTest

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Clean up keystore secrets
        if: always()
        working-directory: android
        run: rm -f release.keystore keystore.properties

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          SECTION_FILE="$RUNNER_TEMP/changelog-section.md"
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"

          awk -v prefix="## [$VERSION]" '
            index($0, "## [") == 1 {
              if (found) exit
              if (index($0, prefix) == 1) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > "$SECTION_FILE"

          if [ ! -s "$SECTION_FILE" ]; then
            echo "See [CHANGELOG.md]($CHANGELOG_URL) and [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for what's in this release." > "$NOTES_FILE"
          elif [ "$(wc -c < "$SECTION_FILE")" -le 1500 ]; then
            cp "$SECTION_FILE" "$NOTES_FILE"
          else
            # Too long for a release body: keep only the highlight lines
            # (Keep-a-Changelog-style "### Added"/"### Fixed" subsection
            # headings, or top-level "- **bold**" bullets when a version
            # has no subsections) and point to CHANGELOG.md for the rest.
            HIGHLIGHTS=$(grep -E '^(### |- \*\*)' "$SECTION_FILE" | sed -E 's/^### (.*)$/- \1/')
            if [ -z "$HIGHLIGHTS" ]; then
              HIGHLIGHTS=$(awk 'BEGIN{p=0} /^[[:space:]]*$/{if(p)exit; next} {print; p=1}' "$SECTION_FILE")
            fi
            {
              printf '%s\n\n' "$HIGHLIGHTS"
              printf 'See [CHANGELOG.md](%s) for the full write-up.\n' "$CHANGELOG_URL"
            } > "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk "CoverDex-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "CoverDex-v${VERSION}.apk" \
            --target main \
            --title "CoverDex v$VERSION" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
