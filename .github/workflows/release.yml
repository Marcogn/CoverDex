name: Release

# Cuts a public release, end to end: bumps the version, builds a signed
# Android release APK, publishes it as a GitHub Release with the
# CHANGELOG.md entry for that version as the release notes, AND deploys
# the same version of the web app to GitHub Pages — all in one run, so
# the Android release and the live site are always on the same version.
# Manual-dispatch only: this opens and merges a version-bump PR against
# `main`, publishes a public GitHub Release, and redeploys the public
# site, so it never runs on its own. See ci.yml for the workflow that
# runs on every PR/push instead (tests only, no publishing).
#
# `main` requires pull requests (see repo Settings -> Branches), so the
# version bump goes through a small PR opened and merged by this
# workflow rather than a direct push — no branch-protection bypass
# needed, just the "Allow GitHub Actions to create and approve pull
# requests" repo setting (Settings -> Actions -> General). If that PR
# can't be auto-merged (e.g. required status checks still pending and
# repo-wide auto-merge isn't enabled), the job only warns and moves on —
# the GitHub Release, APK, and Pages deploy below don't depend on it
# having landed yet, only on the local build.
#
# Like android-build.yml, this never uploads Android build output via
# actions/upload-artifact — the APK here is instead attached directly to
# a GitHub Release, which is meant to be public, so that's the intended
# distribution channel for this workflow specifically.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 1.0.0 (no "v" prefix). Leave blank to
          release the version already in package.json as-is — this is
          what the first release (1.0.0) should do, since nothing needs
          bumping yet.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      # @capacitor/cli 8.x requires Node >=22, same as android-build.yml.
      # Building the plain web app (for Pages) on the same Node version is
      # fine — only the Capacitor CLI actually needs 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine release version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a plain X.Y.Z semantic version."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Pass a new 'version' input (or bump package.json first) and re-run."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version into package.json and Android build.gradle
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run web test suite
        run: npm run test

      - name: Generate PWA icons
        run: node scripts/generate-icons.mjs

      - name: Build web app (GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_URL: /CoverDex/

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Android web bundle into Android project
        run: npx cap sync android

      - name: Ensure signing secrets are present
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 (and the other ANDROID_KEY* secrets) must be set to cut a public release — an unsigned APK can't be installed on a device. See docs/android/BUILD.md."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # JDK 21 matches the AGP 8.13 / Gradle 8.14 toolchain, same pin as
      # android-build.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: android
        run: |
          if ! echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore || [ ! -s release.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't valid base64 (or decoded to an empty file). This is almost always copy-paste corruption of the secret's value — stray whitespace/newlines, a shell prompt artifact (e.g. zsh's trailing '%'), or the raw .keystore file pasted instead of its base64 encoding. Regenerate it without copy-paste: base64 -w0 android/coverdex-release.keystore | gh secret set ANDROID_KEYSTORE_BASE64 -R marcogn/CoverDex. See docs/android/BUILD.md."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/android/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Gradle lint + unit tests
        working-directory: android
        run: ./gradlew lint testDebugUnitTest

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Clean up keystore secrets
        if: always()
        working-directory: android
        run: rm -f release.keystore keystore.properties

      # Only publish anything now that both builds have actually succeeded —
      # a failed build should never leave a version-bump PR opened against
      # main, a half-published release, or a stale site deploy.
      - name: Open and merge version-bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json android/app/build.gradle
          git commit -m "chore(release): v$VERSION"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "Automated version bump for the v$VERSION release. Opened and merged by \`release.yml\` — see the matching GitHub Release for what shipped.")

          gh pr review "$PR_URL" --approve --body "Automated release version bump." || true

          if ! gh pr merge "$PR_URL" --squash --auto; then
            echo "::warning::Could not auto-merge the version-bump PR ($PR_URL) — merge it manually. The GitHub Release, APK, and Pages deploy below don't depend on it and will still publish."
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          awk -v prefix="## [$VERSION]" '
            index($0, "## [") == 1 {
              if (found) exit
              if (index($0, prefix) == 1) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) and [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for what's in this release." > "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk "CoverDex-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "CoverDex-v${VERSION}.apk" \
            --target main \
            --title "CoverDex v$VERSION" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
