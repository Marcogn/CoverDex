# Claude reviews a pull request when it is opened, reopened or marked ready (not drafts, not
# Dependabot). Needs the CLAUDE_CODE_OAUTH_TOKEN secret (optional). Logic in the kit.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: Marcogn/claude-skill-android-kit/.github/workflows/claude-review.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
