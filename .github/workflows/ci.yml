name: CI

# Validation only — no deployment, no publishing. Runs the web test suite
# and a production build check on every pull request against `main`, and
# on pushes to `main` itself (including the version-bump commit that
# release.yml pushes there). See release.yml for the workflow that
# actually ships anything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: VITE_BASE_URL=/ npm run build
      - run: test -d dist && test -n "$(ls -A dist)"
